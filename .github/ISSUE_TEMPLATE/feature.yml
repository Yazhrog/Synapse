name: Feature request
description: A new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should be built. Larger features become a parent issue with sub-issues.
  - type: textarea
    id: files
    attributes:
      label: Relevant files
