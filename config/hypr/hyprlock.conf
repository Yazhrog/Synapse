# src/config/hyprlock.conf

$font = JetBrainsMono Nerd Font Propo
$font_bold = JetBrainsMono Nerd Font ExtraBold

# Source the dynamically generated Matugen colors
source = ~/.config/hypr/colors.conf

# BACKGROUND
background {
    monitor =
    path = ~/.config/Synapse/src/user_data/wallpapers/curr_wall_static.jpg
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H : %M")"
    color = rgb(FFFFFF)
    font_size = 120
    font_family = $font_bold
    position = 0, 320
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    # Fully integrated Matugen variables
    outer_color = rgb($outline)
    inner_color = rgb($surface_bright)
    font_color = rgb($primary)

    fade_on_empty = false
    font_family = $font_bold
    placeholder_text = <i>󰈷 Enter Password</i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

# Suspend
label {
    monitor =
    text = 󰤄
    color = rgb($secondary)
    font_size = 45
    font_family = $font
    onclick = systemctl suspend
    # Anchored to center, shifted left
    position = -200, 100
    halign = center
    valign = bottom
}

# Reboot
label {
    monitor =
    text = 󰜉
    color = rgb($secondary)
    font_size = 45
    font_family = $font
    onclick = reboot now
    # Anchored perfectly in the center
    position = 0, 100
    halign = center
    valign = bottom
}

# Power off
label {
    monitor =
    text = 󰐥
    color = rgb($secondary)
    font_size = 45
    font_family = $font
    onclick = shutdown now
    # Anchored to center, shifted right
    position = 200, 100
    halign = center
    valign = bottom
}
